name: Dal Koruma Denetimi

# AMAC
# GitHub Free planinda ozel depolar icin sunucu tarafi dal koruma ozelligi
# bulunmadigindan, 'main' dalina dogrudan yapilan gonderimler ONLENEMEZ.
# Bu is akisi, onleyici kontrol yerine TESPIT EDICI kontrol saglar:
# main'e Pull Request disinda gelen her commit tespit edilir, kayit altina
# alinir ve bir duzeltici faaliyet issue'su acilir.
#
# Bkz. docs/33061/MAN.5-konfigurasyon-yonetimi/dal-koruma-telafi-kontrolleri.md
# Ilgili risk: R-16

on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  audit:
    name: main dalina gelen commit'leri denetle
    runs-on: ubuntu-latest
    steps:
      # Buyuk PR inceleme notu kurali PR kurallari modulunden okunur (#390).
      - uses: actions/checkout@v4

      - name: Commit'in bir Pull Request ile geldigini dogrula
        id: audit
        uses: actions/github-script@v7
        with:
          # GitHub API'sinin gecici hatalari denetimi dusurmesin (#129): 28.09.2026'da
          # "Unexpected end of JSON input" ile denetim yapilamadan basarisiz olmustu.
          retries: 3
          script: |
            const sha = context.sha;

            // Commit-PR iliskisi birlestirmeden hemen sonra API'de gecikmeli gorunebilir.
            // 20.10.2026'da denetim birlestirmeden 3 sn sonra basladi, #249'u bulamadi ve
            // yanlis alarm verdi (#252, #253). PR bulunamazsa 15 sn arayla 4 kez daha
            // sorulur; ancak hala bulunamazsa uygunsuzluk sayilir.
            const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));
            let mergedPrs = [];
            for (let attempt = 1; attempt <= 5; attempt++) {
              const { data: prs } =
                await github.rest.repos.listPullRequestsAssociatedWithCommit({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  commit_sha: sha,
                });
              mergedPrs = prs.filter(pr => pr.merged_at !== null);
              if (mergedPrs.length > 0 || attempt === 5) break;
              core.info(`Deneme ${attempt}: commit icin birlesmis PR gorunmuyor; 15 sn sonra yeniden sorulacak.`);
              await sleep(15000);
            }

            if (mergedPrs.length > 0) {
              const pr = mergedPrs[0];
              core.info(`UYGUN: commit ${sha.substring(0,7)} #${pr.number} ile geldi.`);

              // Inceleme onayi (KR-096, #128). Tek kisilik duzende PR'i acan ve
              // birlestiren ayni hesap oldugu icin GitHub "Approve" kaydi olusmaz.
              // Telafi: inceleyen, BIRLESTIRMEDEN ONCE PR'a "onayliyorum" yorumu
              // yazar. Yorum yoksa veya birlestirmeden sonra yazildiysa duzeltici
              // faaliyet acilir.
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                per_page: 100,
              });
              const mergedAt = new Date(pr.merged_at);
              const approval = comments.find(c =>
                /onayl[ıi]yorum/i.test(c.body) && new Date(c.created_at) <= mergedAt);

              if (approval) {
                core.info(`UYGUN: #${pr.number} onay yorumu ${approval.created_at} (${approval.user.login}).`);

                // Buyuk PR'da inceleme notu (#390, KR-140). Boyut gerekcesi gereken PR'in onayi,
                // neyin incelendigini "Incelenen:" satiriyla yazar. T1'de 1.500 satiri asan 7 PR'in
                // hicbirinde yoktu; kural yaziliydi, denetlenmiyordu.
                const rules = require(process.env.GITHUB_WORKSPACE + '/.github/scripts/pr-rules.cjs');
                const files = await github.paginate(github.rest.pulls.listFiles, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                  per_page: 100,
                });
                const failures = [];
                const note = !rules.needsReviewNote(files) || comments.find(c =>
                  c.user.login === approval.user.login && rules.hasReviewNote(c.body) &&
                  new Date(c.created_at) <= mergedAt);
                if (note) {
                  if (note !== true) core.info(`UYGUN: #${pr.number} buyuk PR; inceleme notu ${note.created_at}.`);
                } else {
                  await github.rest.issues.create({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    title: `[DÜZELTİCİ] #${pr.number} büyük PR inceleme notu olmadan birleştirildi`,
                    body: [
                      '## Tespit edilen uygunsuzluk',
                      '',
                      `#${pr.number} ${rules.reviewableLines(files)} satır değiştiriyor (üretilen dosyalar hariç; sınır ${rules.SIZE_LIMIT}). ` +
                        'Onay yorumunda neyin incelendiği yazılmamış (`KR-140`, CONTRIBUTING §5).',
                      '',
                      'Beklenen: onay yorumunda ayrı bir satır — `İncelenen: <ne satır satır, ne örneklemeyle incelendi>`',
                      '',
                      '## Yapılması gerekenler',
                      '',
                      '- [ ] İnceleyen, neyin incelendiğini bu issue\'ya yazdı',
                      '- [ ] Neden atlandığı yazıldı',
                    ].join('\n'),
                    labels: ['tur:duzeltici-faaliyet', 'surec:MAN.8', 'oncelik:orta'],
                  });
                  failures.push(`#${pr.number} büyük PR inceleme notu olmadan birleştirildi.`);
                }

                // Degisiklik talebinde rol onayi BIRLESTIRMEDEN ONCE (#387). PR denetimi kirmiziyken
                // de birlestirme yapilabilir (GitHub Free, R-16) ve issue yorumu PR denetimini yeniden
                // tetiklemez. #284'te IK onayi birlestirmeden 6 dakika sonra yazildi. Denetim
                // birlestirmeden saniyeler sonra calistigi icin issue govdesi birlestirme anindaki
                // haliyle okunur; yorumlar ayrica zamanina gore suzulur.
                const cr = require(process.env.GITHUB_WORKSPACE + '/.github/scripts/change-request-rules.cjs');
                const register = require('fs').readFileSync(
                  process.env.GITHUB_WORKSPACE + '/docs/karar-kayit-defteri.md', 'utf8');
                for (const number of cr.closingIssueNumbers(pr.body)) {
                  const { data: issue } = await github.rest.issues.get({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: number,
                  });
                  if (!issue.labels.some(l => (l.name || l) === 'tur:degisiklik-talebi')) continue;
                  const issueComments = await github.paginate(github.rest.issues.listComments, {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: number,
                    per_page: 100,
                  });
                  const required = cr.requiredRoles({
                    title: issue.title, body: issue.body,
                    changedFiles: files.map(f => f.filename), register,
                  });
                  const before = issueComments.filter(c => new Date(c.created_at) <= mergedAt).map(c => c.body);
                  const missing = cr.missingApprovals([issue.body, ...before], required);
                  if (missing.length === 0) {
                    core.info(`UYGUN: #${pr.number} degisiklik talebi #${number} onayi birlestirmeden once kayitli.`);
                    continue;
                  }
                  await github.rest.issues.create({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    title: `[DÜZELTİCİ] #${pr.number} değişiklik talebi #${number} için ${missing.join(', ')} onayı olmadan birleştirildi`,
                    body: [
                      '## Tespit edilen uygunsuzluk',
                      '',
                      `#${pr.number}, değişiklik talebi #${number}'i kapatıyor. Birleştirmeden önce talepte gereken rolün tarihli onay satırı yok (TEC.2 YAKLASIM §4.1, RACI §3.1).`,
                      '',
                      '| Alan | Değer |',
                      '|---|---|',
                      `| Eksik onay | ${missing.join(', ')} |`,
                      ...required.map(r => `| ${r.role} gerekçesi | ${r.reasons.join('; ')} |`),
                      `| Birleştirme | ${pr.merged_at} |`,
                      '',
                      '## Yapılması gerekenler',
                      '',
                      '- [ ] Onay, onaylaması gereken rolden alındı ve talebe `Paydaş onayı: GG.AA.YYYY — <rol> — <kanal>` biçiminde yazıldı',
                      '- [ ] Onay alınamıyorsa değişikliğin geri alınması değerlendirildi',
                      '- [ ] Değişiklik kabul planına `T-xx` teyit maddesi olarak eklendi',
                      '- [ ] Neden atlandığı yazıldı',
                    ].join('\n'),
                    labels: ['tur:duzeltici-faaliyet', 'surec:TEC.2', 'oncelik:yuksek'],
                  });
                  failures.push(`#${pr.number} değişiklik talebi #${number} için ${missing.join(', ')} onayı olmadan birleştirildi.`);
                }

                if (failures.length > 0) {
                  core.setOutput('issue_opened', 'true');
                  core.setFailed(failures.join(' ') + ' Düzeltici faaliyet issue\'su açıldı.');
                }
                return;
              }

              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `[DÜZELTİCİ] #${pr.number} onay yorumu olmadan birleştirildi`,
                body: [
                  '## Tespit edilen uygunsuzluk',
                  '',
                  `#${pr.number} birleştirilmeden önce PR'a inceleme onayı yorumu yazılmamıştır (\`KR-096\`, CONTRIBUTING §5).`,
                  '',
                  '| Alan | Değer |',
                  '|---|---|',
                  `| PR | #${pr.number} — ${pr.title} |`,
                  `| Birleştirme | ${pr.merged_at} |`,
                  `| Commit | ${sha} |`,
                  '',
                  '## Yapılması gerekenler',
                  '',
                  '- [ ] PR incelendi; onay ve tarihi bu issue\'ya yazıldı',
                  '- [ ] Neden atlandığı yazıldı',
                ].join('\n'),
                labels: ['tur:duzeltici-faaliyet', 'surec:MAN.8', 'oncelik:orta'],
              });
              core.setOutput('issue_opened', 'true');
              core.setFailed(`#${pr.number} onay yorumu olmadan birleştirildi. Düzeltici faaliyet issue'su açıldı.`);
              return;
            }

            // Ilk commit (depo baslangici) muaf tutulur.
            const { data: commit } = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha,
            });
            if (commit.parents.length === 0) {
              core.info('Ilk commit; denetim disi.');
              return;
            }

            const author   = commit.commit.author.name;
            const subject  = commit.commit.message.split('\n')[0];
            const date     = commit.commit.author.date;
            const shortSha = sha.substring(0, 7);

            const issueTitle = `[DÜZELTİCİ] main dalına PR olmadan commit geldi (${shortSha})`;
            const issueBody = [
              '## Tespit edilen uygunsuzluk',
              '',
              `\`main\` dalına Pull Request kullanılmadan doğrudan bir commit gönderilmiştir.`,
              'Bu, `CONTRIBUTING.md` §1 kuralına ve MAN.5 (Konfigürasyon Yönetimi) sürecine aykırıdır.',
              '',
              '| Alan | Değer |',
              '|---|---|',
              `| Commit | ${sha} |`,
              `| Mesaj | ${subject} |`,
              `| Yazar | ${author} |`,
              `| Tarih | ${date} |`,
              '',
              '## Tespit kaynağı',
              '',
              'Otomatik denetim — `branch-protection-check.yml`',
              '',
              '## Etkisi',
              '',
              'Değişiklik kod incelemesinden ve CI kalite kapılarından geçmemiştir.',
              'Konfigürasyon öğesi üzerindeki değişiklik onaysız uygulanmıştır.',
              '',
              '## Yapılması gerekenler',
              '',
              '- [ ] Commit içeriği gözden geçirildi',
              '- [ ] Kalite kapıları geriye dönük çalıştırıldı',
              '- [ ] Gerekliyse düzeltme PR ile yapıldı',
              '- [ ] Kök neden yazıldı ve tekrarı önlendi',
              '',
              '> Sunucu tarafı dal koruma GitHub Free planında kullanılamadığı için bu',
              '> kontrol **önleyici değil tespit edicidir**. Kalıcı çözüm için `R-16`.',
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: issueTitle,
              body: issueBody,
              labels: ['tur:duzeltici-faaliyet', 'surec:MAN.5', 'oncelik:yuksek'],
            });

            core.setOutput('issue_opened', 'true');
            core.setFailed(
              `main dalına PR olmadan commit geldi: ${shortSha}. Düzeltici faaliyet issue'su açıldı.`
            );

      # Denetim yeniden denemelere ragmen YAPILAMADIYSA bu da kayda gecer (#129).
      # Aksi halde basarisiz bir calisma, denetlenmemis bir commit'i sessizce
      # gecirmis olurdu (28.09.2026, calisma 36471125839).
      - name: Denetim yapilamadiysa duzeltici faaliyet ac
        if: failure() && steps.audit.outputs.issue_opened != 'true'
        uses: actions/github-script@v7
        with:
          retries: 3
          script: |
            const sha = context.sha;
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[DÜZELTİCİ] Dal koruma denetimi yapılamadı (${sha.substring(0, 7)})`,
              body: [
                '## Tespit edilen durum',
                '',
                `\`main\`'e gelen commit için dal koruma denetimi (PR ile gelme ve inceleme onayı) **yapılamadı**.`,
                'Commit\'in uygun olup olmadığı bilinmiyor.',
                '',
                '| Alan | Değer |',
                '|---|---|',
                `| Commit | ${sha} |`,
                `| Çalışma | ${run} |`,
                '',
                '## Yapılması gerekenler',
                '',
                '- [ ] Çalışma yeniden çalıştırıldı veya commit\'in PR\'ı ve onay yorumu elle doğrulandı',
                '- [ ] Sonuç ve hatanın nedeni bu issue\'ya yazıldı',
              ].join('\n'),
              labels: ['tur:duzeltici-faaliyet', 'surec:MAN.5', 'oncelik:orta'],
            });
