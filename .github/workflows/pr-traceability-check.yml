# PR izlenebilirlik denetimi (MAN.5 · MAN.8)
#
# Izlenebilirlik zinciri: gereksinim -> issue -> PR -> test -> kabul.
# Zincirde kopuk halka varsa "bu gereksinim hangi degisiklikle karsilandi"
# sorusu belgelerden cevaplanamaz.
#
# Bu denetim, #17 duzeltici faaliyetinin sonucudur: kural yazili olmadigi ve
# otomatik denetlenmedigi icin milestone ve issue baglantisi unutulabiliyordu.
#
# 17.09.2026'da ayni kok neden BASLIK icin tekrarladi (#44): 20 PR boyunca yalnizca
# aliskanlikla korunan bicim, 21.'sinde kirildi. Baslik denetimi o gun eklendi.
#
# 25.09.2026'da DAL ADI icin ucuncu kez goruldu (#67): son 10 PR'in dali
# CONTRIBUTING §3'te olmayan oneklerle acilmisti. Dal adi denetimi o gun eklendi.

name: PR izlenebilirlik denetimi

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, milestoned, demilestoned, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  traceability:
    name: Baslik, dal adi, milestone ve issue baglantisi
    runs-on: ubuntu-latest

    steps:
      # Denetimin KENDISI once sinanir.
      #
      # Baslik kurali bir duzenli ifadeye dayaniyor. Duzenli ifadeler sessizce
      # bozulur: yanlis yazilmis bir ifade her basligi gecirir ve kapi calisiyor
      # gorunurken hicbir sey denetlemez. Betik, ifadeyi is akisi dosyasindan
      # AYNEN okuyup 13 ornek uzerinde sinar; kopyasini degil, calisani dener.
      - uses: actions/checkout@v4

      - name: Baslik kuralini sina
        run: node .github/scripts/title-format-test.mjs

      - name: Dal adi kuralini sina
        run: node .github/scripts/branch-name-test.mjs

      - name: Degisiklik talebi onay kuralini sina
        run: node .github/scripts/change-request-approval-test.mjs

      - name: PR disiplini kurallarini sina
        run: node .github/scripts/pr-discipline-test.mjs

      # Gereksinim zinciri: paydas gereksinimi -> sistem gereksinimi -> matris.
      # Ayni esleme uc yerde duruyor (SYG §4, SYG §8, izlenebilirlik matrisi); elle
      # tutulan kopyalar ilk degisiklikte ayrilir. Betik once kendini sinar.
      - name: Gereksinim izlenebilirligini denetle
        run: node .github/scripts/requirement-traceability-check.mjs

      # Belge tutarliligi (#214): "Son guncelleme" degisiklik gecmisinin son satirindan
      # eski olamaz; SYG bolum 1 ozet sayimlari bolum 4'ten yeniden sayilir. T3 modul
      # sonu denetiminde 13 belgenin basligi ve SYG sayimlari bayatti; kural yaziliydi
      # ama denetlenmiyordu. Betik once kendini sinar.
      - name: Belge tutarliligini denetle
        run: node .github/scripts/doc-consistency-check.mjs

      - name: Denetle
        uses: actions/github-script@v7
        with:
          script: |
            // PR, olay yukunden DEGIL API'den okunur.
            //
            // Olay yuku ("payload"), olayin olustugu andaki anlik goruntudur.
            // "gh pr create --milestone" once PR'i acar, sonra milestone atar;
            // "opened" olayi ikisinin arasinda tetiklendiginde yukte milestone
            // HENUZ YOKTUR ve denetim, atanmis bir milestone'u atanmamis sanip
            // duser. Bu iki kez yasandi (PR #51 ve #61).
            //
            // API'den taze okumak, yarisi ortadan kaldirir.
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });

            const body = pr.body || '';
            const problems = [];

            // --- 1. Baslik bicimi ---
            //
            // Neden CI'da? Birlestirme "squash merge" ile yapilir ve GitHub, squash
            // commit'inin konu satirini PR BASLIGINDAN uretir. Uyumsuz bir baslik,
            // Conventional Commits'e uymayan bir commit olarak main'e girer.
            // Yerel "commit-msg" kancasi bunu goremez; yalnizca yerel commit'lere
            // bakar. Denetlenebilecek tek yer burasidir.
            //
            // Turler CONTRIBUTING.md §4 ile ayni listedir.
            const TYPES = 'feat|fix|docs|test|refactor|perf|build|ci|chore';
            const TITLE_PATTERN = new RegExp(
              '^(' + TYPES + ')(\\([a-z0-9._-]+\\))?!?: .+');
            const title = pr.title || '';

            if (!TITLE_PATTERN.test(title)) {
              // Issue bicimi en sik yapilan hatadir; ayrica soylenir ki
              // gelistirici neyi duzeltecegini aramak zorunda kalmasin.
              const looksLikeIssueTitle = /^\s*\[[^\]]+\]/.test(title);

              problems.push(
                'Baslik Conventional Commits bicimine uymuyor: "' + title + '"' +
                (looksLikeIssueTitle
                  ? '\n    Bu bir ISSUE basligi bicimidir ("[GOREV] ..."); PR\'larda kullanilmaz.'
                  : '') +
                '\n    Beklenen: <tur>(<kapsam>): <ozet>' +
                '\n    Ornek:    feat(uat): TLS devreye alindi' +
                '\n    Turler:   ' + TYPES.split('|').join(', '));
            }

            // --- 2. Milestone ---
            if (!pr.milestone) {
              problems.push(
                'Milestone atanmamis. PR, isin ait oldugu WBS kalemine karsilik gelen ' +
                'milestone\'a baglanmalidir (A0/A1/A2/A3/A4+/AS veya surec isleri icin SK); ' +
                'asama planlamasi ve ilerleme olcumu buna dayanir.');
            }

            // --- 3. Issue baglantisi ---
            // "Closes #42" issue'yu kapatir ve resmi baglantiyi uretir.
            // "Refs #42" yalnizca metinsel bagdir; gereksinim issue'lari icin
            // kullanilir (modul kabul edilene kadar acik kalirlar).
            const hasClosingRef = /\b(clos(e[sd]?)|fix(e[sd]?)?|resolv(e[sd]?))\s+#\d+/i.test(body);
            const hasPlainRef = /\brefs?\s+#\d+/i.test(body);

            if (!hasClosingRef && !hasPlainRef) {
              problems.push(
                'Issue baglantisi yok. Govdede "Closes #42" (gorev/hata) veya ' +
                '"Refs #42" (gereksinim) bulunmalidir.');
            }

            // --- 4. Sablonun doldurulmus olmasi ---
            if (/^Closes #\s*$/m.test(body)) {
              problems.push(
                'PR sablonundaki "Closes #" satiri doldurulmamis.');
            }

            // --- 5. Dal adi ---
            //
            // Dal adi, degisikligin turunu PR acmadan gosteren tek isarettir.
            // Kural yazili oldugu halde 10 PR boyunca listede olmayan onekler
            // kullanildi (#67); ayni kok neden #17 ve #44'te de goruldu: yazili
            // ama denetlenmeyen kural aliskanlikla kaybolur.
            //
            // Turler CONTRIBUTING.md §3 ile ayni listedir.
            const BRANCH_TYPES = 'ozellik|hata|dokuman|bakim|duzeltici';
            const BRANCH_PATTERN = new RegExp(
              '^(' + BRANCH_TYPES + ')/(\\d+)-[a-z0-9]+(-[a-z0-9]+)*$');
            const branch = pr.head.ref || '';
            const branchMatch = BRANCH_PATTERN.exec(branch);

            if (!branchMatch) {
              problems.push(
                'Dal adi CONTRIBUTING.md §3 bicimine uymuyor: "' + branch + '"' +
                '\n    Beklenen: <tur>/<issue-no>-<kisa-aciklama>' +
                '\n    Ornek:    dokuman/64-t3-sistem-gereksinimleri' +
                '\n    Turler:   ' + BRANCH_TYPES.split('|').join(', '));
            } else {
              // Dal, bagli oldugu issue'nun numarasini tasimalidir; aksi halde
              // dal adi yanlis isi gosterir.
              const linkedIssues = [...body.matchAll(
                /\b(?:clos(?:e[sd]?)|fix(?:e[sd]?)?|resolv(?:e[sd]?)|refs?)\s+#(\d+)/gi)]
                .map(m => m[1]);
              if (linkedIssues.length > 0 && !linkedIssues.includes(branchMatch[2])) {
                problems.push(
                  'Dal adindaki issue numarasi (#' + branchMatch[2] + ') PR govdesinde ' +
                  'bagli issue\'lar arasinda yok (' + linkedIssues.map(n => '#' + n).join(', ') + ').');
              }
            }

            // --- 6. Degisiklik talebinde paydas onayi (#210) ---
            //
            // Onayli bir gereksinimi degistiren is, paydasin onayi KAYDA GECMEDEN
            // birlestirilmez (TEC.2 YAKLASIM §4.1). #185'te uygulama PR'i, IK onayi
            // kayda gecmeden 49 dakika once birlesti ve UAT'ye kuruldu.
            // Onay, kapatilan issue'nun govdesinde (sablondaki "Paydas onayi" alani)
            // veya bir yorumunda tarihli bir satirdir.
            // BASLA: onay-denetimi
            function hasStakeholderApproval(texts) {
              const DATE = /\b(\d{2}\.\d{2}\.\d{4}|\d{4}-\d{2}-\d{2})\b/;
              for (const text of texts) {
                const lines = (text || '').split('\n');
                for (let i = 0; i < lines.length; i++) {
                  if (!/payda[şs]\s+onay/i.test(lines[i])) continue;
                  // Sablonun urettigi baslik ("### Paydas onayi") ise deger bir sonraki
                  // dolu satirdadir; bos alan "_No response_" olarak gelir.
                  let value = lines[i];
                  if (/^\s*#{1,6}\s/.test(lines[i])) {
                    value = lines.slice(i + 1).find((l) => l.trim() !== '') || '';
                  }
                  if (!/_No response_/.test(value) && DATE.test(value)) return true;
                }
              }
              return false;
            }
            // BITIR: onay-denetimi

            const closingIssues = [...body.matchAll(
              /\b(?:clos(?:e[sd]?)|fix(?:e[sd]?)?|resolv(?:e[sd]?))\s+#(\d+)/gi)]
              .map(m => Number(m[1]));
            for (const number of closingIssues) {
              const { data: issue } = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: number,
              });
              const issueLabels = issue.labels.map(l => l.name || l);
              // --- 7b. Kapatilan issue'nun tur etiketi (#216) ---
              if (!issueLabels.some(n => n.startsWith('tur:'))) {
                problems.push(
                  '#' + number + ' issue\'sunda "tur:" etiketi yok. Issue turu (gorev, hata, ' +
                  'duzeltici faaliyet...) olcutlerin sayimi icin gereklidir (MAN.2).');
              }
              if (!issueLabels.includes('tur:degisiklik-talebi')) continue;
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: number,
                per_page: 100,
              });
              if (!hasStakeholderApproval([issue.body, ...comments.map(c => c.body)])) {
                problems.push(
                  '#' + number + ' bir degisiklik talebi, ama paydas onayi kayitli degil.' +
                  '\n    Onay geldiginde issue\'ya su bicimde bir yorum yazilir:' +
                  '\n    Paydas onayi: GG.AA.YYYY — <onaylayan rol> — <kanal>' +
                  '\n    Ayrinti: TEC.2 YAKLASIM §4.1');
              }
            }

            // --- 7. PR etiketleri (#216) ---
            //
            // 04.10–13.10.2026 arasinda acilan 23 issue'nun 13'unde tur etiketi yoktu,
            // #153–#191 PR'lari etiketsizdi; MAN.2 olcutleri (hata, duzeltici faaliyet,
            // degisiklik talebi sayilari) bu yuzden eksik sayildi. Kural yaziliydi,
            // denetlenmiyordu (T3 modul sonu denetimi M-09).
            const prLabels = (pr.labels || []).map(l => l.name || l);
            if (!prLabels.some(n => n.startsWith('tur:'))) {
              problems.push('PR\'da "tur:" etiketi yok (orn. tur:gelistirme, tur:dokuman, tur:hata).');
            }
            if (!prLabels.some(n => n.startsWith('surec:'))) {
              problems.push('PR\'da "surec:" etiketi yok (orn. surec:TEC.7). Hangi 33061 surecinin kaniti oldugunu gosterir.');
            }

            // BASLA: pr-disiplini
            // Tamamlanma tanimindaki "atlanamaz" iki madde (CONTRIBUTING §6) PR govdesinde
            // ya isaretlidir ya da ustu cizilip gerekcesi yazilmistir. Ornek PR'larin
            // hicbirinde bu iki madde yoktu (T3 modul sonu denetimi, TEC.7-8).
            const MANDATORY_DOD = [
              { name: 'Yetki sizintisi testi', pattern: /yetki\s+s[ıi]z[ıi]nt[ıi]s[ıi]/i },
              { name: 'Maskeleme testi', pattern: /maskeleme\s+testi/i },
            ];
            function missingMandatoryDod(prBody) {
              const lines = (prBody || '').split('\n');
              return MANDATORY_DOD.filter(({ pattern }) => !lines.some(line => {
                if (!pattern.test(line)) return false;
                if (/^\s*-\s*\[[xX]\]/.test(line)) return true;
                // "- [ ] ~~Madde~~ — gerekce": ustu cizili ve gerekcesi var.
                const struck = line.match(/^\s*-\s*\[ \]\s*~~[^~]+~~\s*[—–-]+\s*(.*)$/);
                return Boolean(struck && struck[1].trim().length >= 5);
              })).map(d => d.name);
            }

            // Uretilen dosyalar boyut sayimina girmez: degisikligi insan yazmadi.
            const GENERATED = [
              /(^|\/)src\/shared\/api\/generated\//,
              /^docs\/api\/openapi-v1\.json$/,
              /\/Migrations\/[^/]+\.Designer\.cs$/,
              /ModelSnapshot\.cs$/,
              /(^|\/)package-lock\.json$/,
            ];
            const SIZE_LIMIT = 1500;
            function reviewableLines(files) {
              return files
                .filter(f => !GENERATED.some(p => p.test(f.filename)))
                .reduce((sum, f) => sum + (f.additions || 0) + (f.deletions || 0), 0);
            }
            function needsSizeJustification(files, prBody) {
              return reviewableLines(files) > SIZE_LIMIT && !/boyut\s+gerek[çc]esi/i.test(prBody || '');
            }
            // BITIR: pr-disiplini

            // --- 8. Atlanamaz tamamlanma maddeleri (#216) ---
            for (const name of missingMandatoryDod(body)) {
              problems.push(
                'Tamamlanma tanimindaki atlanamaz madde eksik: "' + name + '".' +
                '\n    Ya isaretlenir (- [x]) ya da ustu cizilip gerekcesi yazilir:' +
                '\n    - [ ] ~~' + name + '~~ — kod degisikligi yok' +
                '\n    Ayrinti: CONTRIBUTING.md §6');
            }

            // --- 9. PR boyutu (#216) ---
            //
            // #191 +5.319 satir ve iki ozellik tasiyordu; inceleme bu boyutta guvenilir
            // olmaz. Hedef 400 satirin altidir (CONTRIBUTING §5); 1.500'u asan PR,
            // neden bolunmedigini govdede yazar.
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });
            if (needsSizeJustification(files, body)) {
              problems.push(
                'PR ' + reviewableLines(files) + ' satir degistiriyor (uretilen dosyalar haric; sinir ' + SIZE_LIMIT + ').' +
                '\n    Bolunemiyorsa govdeye "Boyut gerekcesi:" ile neden bolunmedigi yazilir.' +
                '\n    Ayrinti: CONTRIBUTING.md §5');
            }

            if (problems.length > 0) {
              core.setFailed(
                'PR izlenebilirlik denetimi basarisiz:\n' +
                problems.map(e => `  - ${e}`).join('\n') +
                '\n\nAyrinti: CONTRIBUTING.md §5');
              return;
            }

            core.info('Izlenebilirlik denetimi gecti.');
            core.info(`Baslik: ${title}`);
            core.info(`Dal: ${branch}`);
            core.info(`Milestone: ${pr.milestone.title}`);
            core.info(`Issue baglantisi: ${hasClosingRef ? 'Closes/Fixes' : 'Refs'}`);
