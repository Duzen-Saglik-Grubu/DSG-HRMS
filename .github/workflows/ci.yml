# Surekli tumlestirme - kalite kapilari (ADR-0011 §6)
#
# Kapilar UYARI DEGIL, ENGELDIR. Gecici olarak devre disi birakilmasi gerekirse
# gerekcesi PR'da yazilir ve "tur:duzeltici-faaliyet" etiketli bir issue acilir.
#
# Kapilarin bir kismi zaten derleme zamaninda calisir (uyarilar hata, .NET analiz
# kurallari, NuGet guvenlik denetimi); burada tekrarlanmaz, derleme adiminda
# kendiliginden uygulanir.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  # Entegrasyon testleri Testcontainers ile gercek PostgreSQL kaldirir (ADR-0011 §3).
  TESTCONTAINERS_RYUK_DISABLED: 'false'

jobs:
  # ------------------------------------------------------------------
  # Kapi 1-5: Derleme, bicim, testler, kapsam, mimari
  # ------------------------------------------------------------------
  derleme-ve-test:
    name: Derleme, test ve kapsam
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: .NET kur
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Araclari geri yukle
        run: dotnet tool restore

      - name: Paketleri geri yukle
        run: dotnet restore src/backend/Dsg.Hrms.slnx

      # KAPI 1 - Derleme: uyari yok.
      # TreatWarningsAsErrors ve .NET analiz kurallari Directory.Build.props'ta
      # acik; bu adim ayni zamanda STATIK ANALIZ kapisidir (KAPI 4).
      - name: Derle
        run: dotnet build src/backend/Dsg.Hrms.slnx --no-restore -warnaserror

      # KAPI 2 - Bicim: dotnet format temiz olmali.
      - name: Bicim denetimi
        run: dotnet format src/backend/Dsg.Hrms.slnx --verify-no-changes --no-restore

      # KAPI 3 - Testler: tamami gecmeli (mimari testleri dâhil - KAPI 5).
      - name: Testler ve kapsam olcumu
        run: |
          dotnet test src/backend/Dsg.Hrms.slnx \
            --no-build \
            --settings src/backend/coverlet.runsettings \
            --results-directory artifacts/coverage \
            --logger 'trx;LogFileName=test-sonuclari.trx'

      # KAPI 4 - Kapsam esigi: genel %75, Domain %90 (ADR-0011 §1).
      - name: Kapsam raporu
        run: |
          dotnet reportgenerator \
            "-reports:artifacts/coverage/**/coverage.cobertura.xml" \
            "-targetdir:artifacts/coverage-report" \
            "-reporttypes:TextSummary;Cobertura;MarkdownSummaryGithub"

      - name: Kapsam esigini denetle
        run: ./.github/scripts/kapsam-denetimi.sh artifacts/coverage-report/Cobertura.xml

      - name: Kapsam ozetini is akisina yaz
        if: always()
        run: cat artifacts/coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Sonuclari sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-ve-kapsam
          path: |
            artifacts/coverage-report/
            artifacts/coverage/**/*.trx
          if-no-files-found: warn

  # ------------------------------------------------------------------
  # Frontend kapilari: bicim, lint, tip denetimi, test, kapsam, derleme
  # ------------------------------------------------------------------
  frontend:
    name: Frontend - lint, test ve derleme
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/frontend/dsg-hrms-web

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/dsg-hrms-web/package-lock.json

      # "npm ci" package-lock.json'a BIREBIR uyar; surumler koşumdan koşuma
      # degismez (MAN.5 - konfigurasyon yonetimi).
      - name: Paketleri kur
        run: npm ci

      - name: Bicim denetimi
        run: npm run format:check

      # --max-warnings 0: uyari birikmesine izin verilmez. Birikmis uyari,
      # zamanla "zaten hep kirmizi" durumuna donusur ve hicbir sey ifade etmez.
      - name: Lint
        run: npm run lint

      - name: Tip denetimi
        run: npm run typecheck

      - name: Testler ve kapsam
        run: npm run test:coverage

      - name: Derleme
        run: npm run build

      # API tipleri OpenAPI belgesinden URETILIR; elle yazilmaz (ADR-0010 §1).
      # Belge degisip tipler yenilenmezse, frontend gercekte var olmayan bir
      # sozlesmeye gore derlenir ve uyusmazlik calisma zamaninda ortaya cikar.
      - name: Uretilen API tipleri guncel mi
        run: |
          npm run api:types

          if ! git diff --exit-code -- src/shared/api/generated/; then
            echo '::error::Uretilen API tipleri guncel degil.'
            echo 'Su komutu calistirip sonucu commitleyin:'
            echo '  npm run api:types'
            exit 1
          fi

          echo 'API tipleri guncel.'

  # ------------------------------------------------------------------
  # Kapi 6: Migration kontrolu
  # ------------------------------------------------------------------
  migration-denetimi:
    name: Bekleyen model degisikligi yok
    runs-on: ubuntu-latest

    env:
      # Tasarim zamani degeri; gercek bir veritabanina baglanmaz.
      Database__Hrms: 'Host=migration-denetimi;Database=dsg_hrms;Username=denetim;Password=denetim'

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: .NET kur
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: EF araclarini kur
        run: dotnet tool install --global dotnet-ef --version 10.0.12

      # "dotnet ef" proje ustveri okur; geri yukleme yapilmadan calismaz.
      - name: Paketleri geri yukle
        run: dotnet restore src/backend/Dsg.Hrms.slnx

      # Model degistirilip migration uretilmezse, uygulama uretimde veritabani
      # semasiyla uyusmayan bir modelle acilirdi. Hata calisma zamaninda,
      # kullanicinin ilk isleminde ortaya cikardi.
      - name: Bekleyen model degisikligi denetimi
        run: |
          dotnet ef migrations has-pending-model-changes \
            --project src/backend/Dsg.Hrms.Infrastructure \
            --startup-project src/backend/Dsg.Hrms.Api

  # ------------------------------------------------------------------
  # Kapi 7: Bagimlilik guvenligi
  # ------------------------------------------------------------------
  bagimlilik-guvenligi:
    name: Guvenlik acigi olan paket yok
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: .NET kur
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Paketleri geri yukle
        run: dotnet restore src/backend/Dsg.Hrms.slnx

      # NuGetAudit derleme sirasinda da calisir; bu adim GECISLI bagimliliklari
      # da acikca raporlar ve ciktiyi okunabilir birakir.
      - name: Acikli paket taramasi
        run: |
          cikti=$(dotnet list src/backend/Dsg.Hrms.slnx package --vulnerable --include-transitive)
          echo "$cikti"

          if echo "$cikti" | grep -q 'has the following vulnerable packages'; then
            echo '::error::Guvenlik acigi bulunan paket var. Paketi guncelleyin veya degistirin.'
            exit 1
          fi

          echo 'Guvenlik acigi bulunan paket yok.'

  # ------------------------------------------------------------------
  # Kapi 8: Konteyner taramasi
  # ------------------------------------------------------------------
  konteyner-taramasi:
    name: Konteyner taramasi (trivy)
    runs-on: ubuntu-latest

    strategy:
      # Bir imajdaki acik digerinin taranmasini engellemesin; iki sonucu da
      # ayni kosumda gormek istiyoruz.
      fail-fast: false
      matrix:
        include:
          - ad: api
            baglam: src/backend
            dockerfile: src/backend/Dsg.Hrms.Api/Dockerfile
          - ad: web
            baglam: src/frontend/dsg-hrms-web
            dockerfile: src/frontend/dsg-hrms-web/Dockerfile

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Imaji derle
        run: >
          docker build
          -f ${{ matrix.dockerfile }}
          -t dsg-hrms-${{ matrix.ad }}:tarama
          ${{ matrix.baglam }}

      # Uretime giden imajdaki isletim sistemi paketleri de bizim
      # sorumlulugumuzdadir; uygulama kodu temiz olsa bile taban imajdaki bir
      # acik sistemi savunmasiz birakir.
      #
      # Arac, resmi Action sarmalayicisi yerine DOGRUDAN calistirilir: surum
      # dogrudan sabitlenir ve ek bir bagimliligin surum degisikliklerinden
      # etkilenmeyiz (ayni yaklasim sir taramasinda da kullanildi).
      #
      # --ignore-unfixed: yamasi HENUZ YAYIMLANMAMIS aciklar kapiyi kirmaz;
      # yapabilecegimiz bir sey olmadigi icin kalici kirmizi uretirlerdi.
      - name: trivy taramasi
        env:
          TRIVY_SURUM: 0.74.0
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            "aquasec/trivy:${TRIVY_SURUM}" image \
            --scanners vuln \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1 \
            --format table \
            "dsg-hrms-${{ matrix.ad }}:tarama"

  # ------------------------------------------------------------------
  # Kapi 9: Sir taramasi
  # ------------------------------------------------------------------
  sir-taramasi:
    name: Sir taramasi (gitleaks)
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4
        with:
          # Sir, gecmis bir commit'te kalmis olabilir; tarama tum gecmisi kapsar.
          fetch-depth: 0

      # gitleaks ARACI MIT lisanslidir ve serbestce kullanilir; ancak resmi GitHub
      # ACTION sarmalayicisi organizasyon depolarinda UCRETLI LISANS ister.
      # Kosullu ticari lisansli bilesen kullanmama ilkesi geregi (KR-025) araci
      # dogrudan, surumu sabitlenmis olarak calistiriyoruz.
      - name: gitleaks kur
        env:
          GITLEAKS_SURUM: 8.30.1
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_SURUM}/gitleaks_${GITLEAKS_SURUM}_linux_x64.tar.gz" \
            -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/
          gitleaks version

      # --redact: bulunan sir, is akisi gunlugune YAZILMAZ. Aksi hâlde tarama
      # sonucunun kendisi ikinci bir sizinti kaynagi olurdu.
      - name: Sir taramasi
        run: gitleaks git --no-banner --redact --verbose .
