name: "Değişiklik Talebi"
description: "Kabul edilmiş bir kapsam, gereksinim veya karar üzerinde değişiklik isteği"
title: "[DEĞİŞİKLİK] "
labels: ["tur:degisiklik-talebi", "surec:TEC.2"]
body:
  - type: markdown
    attributes:
      value: |
        Kilitlenmiş bir modül kapsamına sonradan gelen talepler **mevcut modüle
        eklenmez**; bu issue ile kayıt altına alınır ve önceliklendirilir (`R-04`).

        Yordam: `docs/33061/TEC.2-paydas-ihtiyac-ve-gereksinimleri/YAKLASIM.md` §4.1.
        **Uygulama PR'ı, aşağıdaki "Paydaş onayı" alanı tarihle doldurulmadan
        birleştirilemez** (PR izlenebilirlik denetimi). Onay sonradan gelirse bu
        issue'ya `Paydaş onayı: GG.AA.YYYY — <onaylayan rol> — <kanal>` biçiminde
        bir yorum yazılır.

        **Onaylayan rol denetlenir (#387).** Paydaş gereksinimi (PG) veya İK kararı
        değişiyorsa onay satırının rol alanında **İK** olmalıdır (RACI §3.1: TEC.2'yi
        İK onaylar). Onay Bilgi İşlem aracılığıyla geldiyse rol yine İK yazılır ve
        "(Doğuş Uçanok bildirdi)" eklenir. Yalnızca sistem gereksinimi (SYG), ADR
        veya teknik parametre değişiyorsa Bilgi İşlem onayı yeterlidir.

  - type: textarea
    id: request
    attributes:
      label: "Ne değişsin?"
    validations:
      required: true

  - type: textarea
    id: rationale
    attributes:
      label: "Neden?"
      description: "Talebin gerekçesi. Hangi ihtiyaç karşılanmıyor?"
    validations:
      required: true

  - type: input
    id: affected_items
    attributes:
      label: "Etkilenen kayıt"
      description: "Hangi gereksinim, karar veya modül etkileniyor?"
      placeholder: "PG-IZIN-07 / KR-042 / İzin Yönetimi modülü"
    validations:
      required: true

  - type: dropdown
    id: impact
    attributes:
      label: "Tahmini etki"
      options:
        - "Küçük — mevcut modül içinde çözülebilir"
        - "Orta — ek geliştirme gerektirir, takvimi etkiler"
        - "Büyük — kapsam değişikliği; üst yönetim onayı gerekir"
    validations:
      required: true

  - type: input
    id: requested_by
    attributes:
      label: "Talep eden"
      placeholder: "İK Birimi — 2026-10-02 görüşmesi"
    validations:
      required: true

  # #387: T1'de dort PG degisikligi yalnizca Bilgi Islem onayiyla birlesti; onaylayacak rol
  # talep acilirken belirlenir. CI, "IK" secildiyse onay satirinda IK rolunu arar.
  - type: dropdown
    id: approver_role
    attributes:
      label: "Onaylaması gereken rol"
      description: "RACI §3.1. Paydaş gereksinimi veya İK kararı değişiyorsa İK. Yanlış seçim CI'ı geçirmez: PR paydaş gereksinimi belgesini değiştiriyorsa CI yine İK onayı arar."
      options:
        - "İK — paydaş gereksinimi (PG) veya İK kararı değişiyor"
        - "Bilgi İşlem — yalnızca sistem gereksinimi (SYG), ADR veya teknik parametre"
        - "Üst Yönetim — kapsam veya takvim değişikliği (büyük etki)"
    validations:
      required: true

  - type: input
    id: approval
    attributes:
      label: "Paydaş onayı"
      description: "Biçim: GG.AA.YYYY — <onaylayan rol> — <kanal>. Rolü yazılmamış onay sayılmaz. Onay henüz yoksa boş bırakılır; onay gelince yorumla eklenir."
      placeholder: "10.10.2026 — İK birim yöneticisi — e-posta (BK-nn) / toplantı kaydı"
    validations:
      required: false

  - type: textarea
    id: decision
    attributes:
      label: "Karar (değerlendirme sonrası doldurulur)"
      description: "Kabul / Ret / Ertelendi + gerekçe + karar defteri kimliği (KR-nnn)."
    validations:
      required: false
