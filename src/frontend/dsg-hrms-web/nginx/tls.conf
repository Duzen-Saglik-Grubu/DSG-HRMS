# DSG-HRMS web sunumu - TLS etkin.
#
# Bu yapilandirma, sertifika dosyalari konteynere baglandiginda otomatik olarak
# secilir (bkz. nginx/secim.sh). Sertifika yoksa http.conf kullanilir; boylece
# gelistirme ortami sertifika gerektirmeden calismaya devam eder.

# --------------------------------------------------------------- HTTP -> HTTPS
server {
    listen 8080;
    server_name _;

    server_tokens off;

    # Konteyner saglik kontrolu YONLENDIRILMEZ. Aksi hâlde kontrol HTTPS'e
    # yonlendirilir ve 127.0.0.1 icin sertifika dogrulamasi basarisiz olurdu.
    location = /nginx-health {
        access_log off;
        return 200 "ok";
    }

    # Diger her sey HTTPS'e tasinir. Kullanici adresi elle yazdiginda da
    # sifrelenmemis baglantida kalmaz.
    location / {
        return 301 https://$host$request_uri;
    }
}

# --------------------------------------------------------------------- HTTPS
server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;

    # TLS 1.0 ve 1.1 kullanim disidir; 1.2 ve 1.3 desteklenir.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    # TLS 1.3'te sifre secimi istemciye birakilir; sunucu dayatmasi fayda saglamaz.
    ssl_prefer_server_ciphers off;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    # Oturum biletleri kapali: anahtar donmedigi surece ileri gizliligi zayiflatir.
    ssl_session_tickets off;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/guvenlik-basliklari.conf;

    # HSTS BILINCLI OLARAK EKLENMEDI.
    #
    # HSTS, tarayiciya "bu siteye artik yalnizca HTTPS ile baglan" der ve bu bilgi
    # tarayicida saklanir. Sertifika bir gun yenilenmeyi kacirirsa kullanici
    # uyariyi atlayamaz, sistem tamamen erisilemez hâle gelir.
    #
    # Yenileme bu projede BILINCLI OLARAK ELLE yapilir (KR-067): kurum DNS'i ayri
    # bir ekipce yonetildiginden TXT kaydi otomatik guncellenemiyor. Insana bagli
    # bir adim varken HSTS'in cezasi fazla agirdir. HSTS, yenileme
    # otomatiklestiginde acilacaktir; o zamana kadar R-18 kapsaminda izlenir.
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location = /nginx-health {
        access_log off;
        return 200 "ok";
    }

    location /assets/ {
        include /etc/nginx/guvenlik-basliklari.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    location = /index.html {
        include /etc/nginx/guvenlik-basliklari.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Uygulama, istegin HTTPS ile geldigini bu baslikla bilir; uretilen
        # baglantilar ve cerez isaretleri buna gore davranir.
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
