# Guvenlik basliklari.
#
# Uygulama yerel agda calissa da bu basliklar ucuzdur ve tarayici kaynakli
# saldiri yuzeyini daraltir.
#
# Ayri dosyada tutulmalarinin nedeni nginx'in add_header kalitim kuralidir:
# bir blokta add_header tanimlanirsa ust bloktaki TUM add_header'lar devre disi
# kalir. Include ile her blokta tekrarlanmalari garanti altina alinir.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
