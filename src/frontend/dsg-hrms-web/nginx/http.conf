# DSG-HRMS web sunumu.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Konteyner saglik kontrolu bu yolu kullanir. TLS modunda HTTP sunucusu her
    # istegi HTTPS.e yonlendirdigi icin, saglik kontrolu icin yonlendirilmeyen
    # bir yol gerekir.
    location = /nginx-saglik {
        access_log off;
        return 200 "ok";
    }

    # Guvenlik basliklari ayri bir dosyada tutulur ve HER blokta include edilir.
    #
    # DIKKAT: nginx'te add_header kalitimi "hepsi ya da hicbiri" seklindedir -
    # bir alt blokta add_header tanimlanirsa ust bloktakiler DEVRE DISI KALIR.
    # Bu davranis sessizdir; basliklarin kayboldugu ancak yanit incelenerek
    # fark edilir (bu dosyada bir kez yasandi).
    include /etc/nginx/guvenlik-basliklari.conf;

    # Sunucu surumu gizlenir: saldirgana surum bilgisi vermenin faydasi yok.
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Icerik adresli dosyalar (hash'li ad) uzun sureli onbelleklenir.
    location /assets/ {
        include /etc/nginx/guvenlik-basliklari.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # index.html ONBELLEKLENMEZ: yeni surum dagitildiginda kullanici eski
    # uygulamayi gormemelidir.
    location = /index.html {
        include /etc/nginx/guvenlik-basliklari.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # API ve saglik uclari uygulama sunucusuna yonlendirilir.
    # Tek koken (same-origin) korunur; CORS yapilandirmasina gerek kalmaz.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Tek sayfa uygulamasi geri donusu: bilinmeyen yollar index.html'e duser,
    # yonlendirmeyi React Router yapar. Bu olmadan sayfa yenilendiginde 404 alinir.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
